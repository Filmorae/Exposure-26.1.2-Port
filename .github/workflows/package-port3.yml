name: Package Exposure Port 3
on:
  push:
    branches:
      - release/26.1.2-Fabric-port.3
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: b58e81131a2e7b455b30ca5fe3f0ebf5c94abf24
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "25.0.2"
      - uses: gradle/actions/setup-gradle@v6
      - name: Check and build release JAR
        run: ./gradlew --no-daemon --stacktrace :common:test :common:validateAccessWidener :fabric:validateAccessWidener build
      - name: Print asset checksum
        run: sha256sum 'fabric/build/libs/exposure-fabric-26.1.2-1.9.18-port.3+mc26.1.2.jar'
      - uses: actions/upload-artifact@v7
        with:
          path: fabric/build/libs/exposure-fabric-26.1.2-1.9.18-port.3+mc26.1.2.jar
          archive: false
          if-no-files-found: error
          retention-days: 2
