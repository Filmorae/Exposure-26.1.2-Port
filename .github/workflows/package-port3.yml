name: Package Exposure Port 3
on:
  push:
    branches:
      - release/26.1.2-Fabric-port.3
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: b58e81131a2e7b455b30ca5fe3f0ebf5c94abf24
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "25.0.2"
      - uses: gradle/actions/setup-gradle@v6
      - name: Check and build release JAR
        run: ./gradlew --no-daemon --stacktrace :common:test :common:validateAccessWidener :fabric:validateAccessWidener build
      - name: Upload the verified JAR to the Patch 3 draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jar='fabric/build/libs/exposure-fabric-26.1.2-1.9.18-port.3+mc26.1.2.jar'
          digest='460bf1cf91c6605baf24f3f779a06bb35f485bf7b2201ec708c0f59df6388de3'
          printf '%s  %s\n' "$digest" "$jar" | sha256sum --check --strict
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/26.1.2" --jq '.object.sha')" = 'b58e81131a2e7b455b30ca5fe3f0ebf5c94abf24'
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/460388919" --jq '.draft and .tag_name == "26.1.2-Fabric-port.3" and (.assets | length) == 0')" = true
          result="$(gh api --method POST --header 'Content-Type: application/java-archive' --input "$jar" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/460388919/assets?name=exposure-fabric-26.1.2-1.9.18-port.3%2Bmc26.1.2.jar" --jq '.digest')"
          test "$result" = "sha256:$digest"
